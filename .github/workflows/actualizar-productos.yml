name: Actualizar productos desde Excel

on:
  push:
    paths:
      - "*.xlsx"
      - "tools/generar_productos_json.py"
      - "tools/validar_muebles.py"
      - ".github/workflows/actualizar-productos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generar data/productos.json
        run: |
          python tools/generar_productos_json.py

      - name: Validar muebles.json
        run: |
          python tools/validar_muebles.py

      - name: Commit de JSON actualizado
        run: |
          if [[ -n "$(git status --porcelain data/*.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/*.json
            git commit -m "Actualizar productos desde Excel"
            git push
          else
            echo "Sin cambios en JSON."
          fi
